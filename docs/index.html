<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HK / SGX Command Centre</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-border: #1f2b38;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --green: #2fbf71;
    --red: #e5484d;
    --amber: #d9a441;
    --accent: #4a86e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 16px;
  }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; margin: 0; }
  h1 span { color: var(--text-dim); font-weight: 400; }
  #meta { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  .bench-strip {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .bench-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 16px;
    flex: 1;
    min-width: 180px;
  }
  .bench-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 4px; }
  .bench-price { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bench-changes { font-size: 12px; margin-top: 4px; display: flex; gap: 10px; }

  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 8px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .note { text-transform: none; letter-spacing: normal; font-size: 11px; color: var(--text-dim); font-style: italic; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 10px 14px;
    text-align: right;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--panel-border);
  }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .ticker { font-weight: 600; color: var(--text); }
  .name { color: var(--text-dim); font-size: 12px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--text-dim); }
  .err-row td { color: var(--red); font-style: italic; }

  .score-bar { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--panel-border); position: relative; vertical-align: middle; margin-right: 6px; }
  .score-fill { position: absolute; top:0; left:0; height: 100%; border-radius: 3px; }
  .score-num { font-size: 11px; color: var(--text-dim); }

  #rotation-block { margin-bottom: 28px; }
  .category-block { margin-bottom: 28px; }

  #search {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    width: 220px;
  }
  #search::placeholder { color: var(--text-dim); }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body>

<header>
  <h1>HK / SGX Command Centre <span>&mdash; live prices via yfinance</span></h1>
  <div id="meta">loading&hellip;</div>
</header>

<div id="bench-strip" class="bench-strip"></div>

<div id="rotation-block"></div>

<div class="controls">
  <input id="search" type="text" placeholder="Filter ticker or name&hellip;" oninput="renderAll()" />
</div>

<div id="app"><p style="color:var(--text-dim)">Loading data.json&hellip;</p></div>

<script>
let DATA = null;

function fmtPct(v) {
  if (v === null || v === undefined) return '<span class="neu">&mdash;</span>';
  const cls = v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';
  const sign = v > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v.toFixed(2)}%</span>`;
}

function fmtPrice(row) {
  if (row.last_price === undefined) return '&mdash;';
  return `${row.currency || ''} ${row.last_price}`;
}

function scoreColor(v) {
  if (v === null || v === undefined) return 'var(--text-dim)';
  if (v >= 66) return 'var(--green)';
  if (v >= 33) return 'var(--amber)';
  return 'var(--red)';
}

function scoreBar(v) {
  if (v === null || v === undefined) return '<span class="neu">&mdash;</span>';
  const color = scoreColor(v);
  return `<span class="score-bar"><span class="score-fill" style="width:${v}%;background:${color}"></span></span><span class="score-num">${v}</span>`;
}

function renderBenchmarks() {
  const strip = document.getElementById('bench-strip');
  strip.innerHTML = '';
  for (const [ticker, b] of Object.entries(DATA.benchmarks)) {
    if (b.error) {
      strip.innerHTML += `<div class="bench-card"><div class="bench-label">${ticker}</div><div style="color:var(--red);font-size:12px">no data</div></div>`;
      continue;
    }
    strip.innerHTML += `
      <div class="bench-card">
        <div class="bench-label">${b.label}</div>
        <div class="bench-price">${b.last_price}</div>
        <div class="bench-changes">
          <span>1D ${fmtPct(b.change_1d_pct)}</span>
          <span>1W ${fmtPct(b.change_1w_pct)}</span>
          <span>1M ${fmtPct(b.change_1m_pct)}</span>
        </div>
      </div>`;
  }
}

function renderRotation() {
  const block = document.getElementById('rotation-block');
  const rows = DATA.sector_rotation;
  block.innerHTML = `
    <div class="section-title">Sector Rotation <span class="note">avg 1M change per category, vs assigned benchmark</span></div>
    <table>
      <thead>
        <tr><th>Category</th><th>Count</th><th>Avg 1D</th><th>Avg 1W</th><th>Avg 1M</th><th>Benchmark</th><th>Rel. to Benchmark (1M)</th></tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td class="ticker">${r.category}</td>
            <td class="neu">${r.count}</td>
            <td>${fmtPct(r.avg_1d_pct)}</td>
            <td>${fmtPct(r.avg_1w_pct)}</td>
            <td>${fmtPct(r.avg_1m_pct)}</td>
            <td class="neu">${r.benchmark || '&mdash;'}</td>
            <td>${fmtPct(r.rel_to_benchmark_1m_pct)}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
}

function renderAll() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const app = document.getElementById('app');
  app.innerHTML = '';

  const byCategory = {};
  for (const row of DATA.instruments) {
    if (q && !(row.ticker.toLowerCase().includes(q) || (row.name||'').toLowerCase().includes(q))) continue;
    (byCategory[row.category] = byCategory[row.category] || []).push(row);
  }

  const categoryOrder = ["HK Stock", "HK/SGX ETF", "SGX REIT", "SGX Real Estate", "SGX Pref Share"];
  const cats = Object.keys(byCategory).sort((a,b) => {
    const ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  if (cats.length === 0) {
    app.innerHTML = '<p style="color:var(--text-dim)">No matches.</p>';
    return;
  }

  for (const cat of cats) {
    const block = document.createElement('div');
    block.className = 'category-block';
    const rows = byCategory[cat].sort((a,b) => (b.conviction_score||0) - (a.conviction_score||0));
    block.innerHTML = `
      <div class="section-title">${cat} <span class="note">${rows.length} instruments &middot; sorted by conviction</span></div>
      <table>
        <thead>
          <tr>
            <th>Ticker</th><th>Name</th><th>Last</th><th>As of</th>
            <th>1D</th><th>1W</th><th>1M</th><th>Rel.Strength(1M)</th>
            <th>Conviction</th><th>Feasibility</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => r.error ? `
            <tr class="err-row">
              <td class="ticker">${r.ticker}</td>
              <td colspan="9">error: ${r.error}</td>
            </tr>` : `
            <tr>
              <td class="ticker">${r.ticker}</td>
              <td class="name">${r.name}</td>
              <td>${fmtPrice(r)}</td>
              <td class="neu">${r.last_date || ''}</td>
              <td>${fmtPct(r.change_1d_pct)}</td>
              <td>${fmtPct(r.change_1w_pct)}</td>
              <td>${fmtPct(r.change_1m_pct)}</td>
              <td>${fmtPct(r.rel_strength_1m_pct)}</td>
              <td>${scoreBar(r.conviction_score)}</td>
              <td>${scoreBar(r.feasibility_score)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
    app.appendChild(block);
  }
}

fetch('data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    DATA = data;
    document.getElementById('meta').textContent =
      `${data.instrument_count} instruments · ${data.error_count} errors · updated ${data.last_updated_utc}`;
    renderBenchmarks();
    renderRotation();
    renderAll();
  })
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<p style="color:var(--red)">Failed to load data.json: ${err}</p>`;
  });
</script>

</body>
</html>
